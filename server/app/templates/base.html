<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Luftballons Admin{% if title %} — {{ title }}{% endif %}</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #1a1a1a; }
    body { margin: 0; background: #f6f7f8; }
    header { background: #202124; color: #fff; padding: 12px 20px; }
    header a { color: #e8eaed; margin-right: 14px; text-decoration: none; font-size: 14px; }
    header a.active { color: #fff; font-weight: 600; text-decoration: underline; }
    main { max-width: 960px; margin: 20px auto; padding: 0 16px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .banner { background: #fff3cd; border: 1px solid #ffecb5; padding: 10px 12px; margin-bottom: 16px; font-size: 13px; }
    .warn { background: #fce8e6; border-color: #f5c6cb; }
    table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px; }
    th, td { border: 1px solid #dadce0; padding: 8px 10px; text-align: left; vertical-align: top; }
    th { background: #f1f3f4; }
    .muted { color: #5f6368; font-size: 12px; }
    form.inline { display: inline; }
    button, .btn { font: inherit; padding: 4px 10px; cursor: pointer; }
    .cards { display: flex; gap: 12px; flex-wrap: wrap; }
    .card { background: #fff; border: 1px solid #dadce0; padding: 14px 16px; min-width: 140px; }
    .card .n { font-size: 24px; font-weight: 600; }
    code { font-size: 12px; word-break: break-all; }
  </style>
</head>
<body>
  <header>
    <strong>Luftballons Admin</strong>
    <span class="muted" style="color:#9aa0a6;margin-left:8px;">internal only</span>
    <nav style="margin-top:8px;">
      <a href="/admin/" class="{% if nav == 'overview' %}active{% endif %}">Overview</a>
      <a href="/admin/installations" class="{% if nav == 'installations' %}active{% endif %}">Installations</a>
      <a href="/admin/collections" class="{% if nav == 'collections' %}active{% endif %}">Collections</a>
      <a href="/admin/modules" class="{% if nav == 'modules' %}active{% endif %}">Modules</a>
      <a href="/admin/errors" class="{% if nav == 'errors' %}active{% endif %}">Errors</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
